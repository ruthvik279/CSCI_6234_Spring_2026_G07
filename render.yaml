services:
  - type: web
    name: code-review-automation-backend
    runtime: python
    plan: free
    rootDir: Implementation/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Code Review Automation Assistant
      - key: DEFAULT_COMPLEXITY_THRESHOLD
        value: "15"
      - key: PUBLIC_WEBHOOK_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
  - type: web
    runtime: static
    name: code-review-automation-frontend
    rootDir: Implementation/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
